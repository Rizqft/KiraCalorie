<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}label[for="photo"]{display:none}.actions{grid-template-columns:1fr!important}</style>
<title>KiraKalori</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app, Malay/English toggle in the header, food picker with sticky search and category bar. The day summary is styled as a Maklumat Pemakanan (nutrition information) panel with heavy ink rules; entries are plain rows; tabs are fixed at the bottom. */
:root{
  --bg:#EFF3EE; --surface:#FFFFFF; --ink:#13201A; --ink2:#4B5B52; --line:#D3DCD4; --soft:#E3EBE4;
  --accent:#17684A; --accent-ink:#FFFFFF; --ok-bg:#DDEFE4;
  --warn:#B3321C; --warn-bg:#F9E3DE;
  --protein:#2A6E93; --carb:#C0840A; --fat:#8B4F9E; --scrim:rgba(10,20,14,.5);
  --display:"Archivo Black","Arial Black",Impact,system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1410; --surface:#16201A; --ink:#E9F0EA; --ink2:#9FB2A6; --line:#2A382F; --soft:#1F2B23;
    --accent:#4DC48B; --accent-ink:#06170E; --ok-bg:#173226;
    --warn:#FF8E78; --warn-bg:#3A1D17;
    --protein:#6FB5DB; --carb:#E9B84C; --fat:#C99BD8; --scrim:rgba(0,0,0,.62);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1410; --surface:#16201A; --ink:#E9F0EA; --ink2:#9FB2A6; --line:#2A382F; --soft:#1F2B23;
  --accent:#4DC48B; --accent-ink:#06170E; --ok-bg:#173226;
  --warn:#FF8E78; --warn-bg:#3A1D17;
  --protein:#6FB5DB; --carb:#E9B84C; --fat:#C99BD8; --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--display);font-size:20px;letter-spacing:-.01em}
.sync{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;min-width:0}
.sync i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ink2)}
.sync.ok i{background:var(--accent)}
.sync.warn i{background:var(--warn)}
main{display:flex;flex-direction:column;gap:18px;padding-block:16px calc(92px + env(safe-area-inset-bottom,0px))}

.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar .d{text-align:center;min-width:0}
.datebar .d b{display:block;font-size:17px}
.datebar .d span{font-size:12px;color:var(--ink2)}
.icon-btn{flex:none;width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:6px;display:grid;place-items:center;cursor:pointer}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.label{background:var(--surface);border:2px solid var(--ink);border-radius:4px;padding:10px 14px 12px}
.label .ttl{font-family:var(--display);font-size:21px;line-height:1.1;padding-bottom:6px;border-bottom:8px solid var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.label .ttl small{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.kc{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:8px 0 6px}
.kc .n{font-family:var(--display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.kc .u{font-weight:600;font-size:13px;color:var(--ink2);margin-left:4px}
.kc .rem{text-align:right;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.kc .rem small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.kc .rem.over{color:var(--warn)}
.gauge{height:10px;background:var(--soft);border-radius:2px;overflow:hidden;margin-bottom:8px}
.gauge i{display:block;height:100%;background:var(--accent)}
.gauge.over i{background:var(--warn)}
.rows{border-top:4px solid var(--ink)}
.mrow{display:grid;grid-template-columns:104px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0;padding-bottom:0}
.mrow b{font-weight:700}
.mrow .bar{height:6px;background:var(--soft);border-radius:2px;overflow:hidden}
.mrow .bar i{display:block;height:100%}
.mrow .g{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.mrow .g span{font-weight:400;color:var(--ink2)}
.sub2{font-size:12px;color:var(--ink2);padding-top:8px;border-top:1px solid var(--line);margin-top:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.link{border:0;background:none;padding:6px 0;color:var(--ink2);font-size:12.5px;font-weight:600;text-decoration:underline;cursor:pointer}
.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}

.banner{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:14px}
.sect h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 2px;display:flex;justify-content:space-between;gap:8px}
.entry{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.thumb{width:48px;height:48px;border-radius:4px;background:var(--soft);object-fit:cover;display:grid;place-items:center;font-family:var(--display);color:var(--ink2)}
.entry .nm{font-weight:600;overflow-wrap:anywhere}
.entry .sub{font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.entry .kc2{text-align:right;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end}
.entry .kc2 small{font-weight:500;font-size:11px;color:var(--ink2)}
.empty{padding:18px 0;color:var(--ink2);border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);font-size:14px}
.note{font-size:13px;color:var(--ink2)}

.mtitle{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mtitle b{font-family:var(--display);font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:11px;font-weight:700;color:var(--ink2);text-align:center;text-transform:uppercase;letter-spacing:.04em;padding-bottom:2px}
.day{aspect-ratio:1/1.1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:4px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:4px 5px;cursor:pointer;text-align:left}
.day .num{font-weight:700;font-size:13px}
.day .kk{font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.day.ok{background:var(--ok-bg);border-color:var(--accent)}
.day.over{background:var(--warn-bg);border-color:var(--warn)}
.day.low{background:var(--soft);border-style:dashed;border-color:var(--ink2)}
.day.some{border-color:var(--ink2)}
.day.today{outline:2px solid var(--ink);outline-offset:1px}
.day:disabled{opacity:.4;cursor:not-allowed}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;border:1px solid var(--line);display:inline-block}
.legend .ok{background:var(--ok-bg);border-color:var(--accent)}
.legend .over{background:var(--warn-bg);border-color:var(--warn)}
.legend .low{background:var(--soft);border:1px dashed var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{border-top:4px solid var(--ink);padding-top:6px}
.stats b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--ink2)}

h2.sec{font-family:var(--display);font-size:20px;margin:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.in{min-height:46px;width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 12px;font-size:16px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{min-height:46px;border:0;border-right:1px solid var(--line);background:transparent;font-weight:600;cursor:pointer;padding:0 8px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.form{display:flex;flex-direction:column;gap:14px}
.warnbox{background:var(--warn-bg);border:1px solid var(--warn);border-radius:6px;padding:10px 12px;font-size:13.5px}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink2);font:11px var(--body)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:none;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.sheet{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border:1px solid var(--line);border-radius:12px 12px 0 0;padding-top:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.phead h2{font-family:var(--display);font-size:20px;margin:0}
.prev{width:100%;max-height:220px;object-fit:cover;border-radius:6px;display:block;background:var(--soft)}
.busy{display:flex;gap:14px;align-items:flex-start}
.busy p{margin:0;font-size:14px;color:var(--ink2)}
.spin{flex:none;width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.item{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
.nameinp{width:100%;border:0;border-bottom:2px solid var(--ink);background:transparent;font-weight:700;font-size:16px;padding:4px 0;border-radius:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.nums label{display:flex;flex-direction:column;gap:2px;font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em;min-width:0}
.nums input{width:100%;min-height:42px;border:1px solid var(--line);border-radius:4px;padding:0 8px;background:var(--bg);font-size:16px;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:4px solid var(--ink);padding-top:8px;font-weight:700;font-variant-numeric:tabular-nums}
.total span{font-weight:500;color:var(--ink2)}
.pickrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:54px;padding:8px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.pickrow small{display:block;color:var(--ink2);font-size:12.5px}
.pickrow em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}
.foodlist{display:flex;flex-direction:column}
.btnrow{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:6px;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px);font-weight:500;font-size:14px}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px 0}
.top .hr{display:flex;align-items:center;gap:10px;min-width:0}
#syncT{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lang{display:flex;flex:none;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.lang button{min-width:44px;min-height:40px;border:0;background:transparent;font-weight:700;font-size:13px;color:var(--ink2);cursor:pointer;padding:0 8px}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.panel>*{flex:none}
.panel.tall{height:92%}
.pickhead{position:sticky;top:-16px;z-index:2;background:var(--bg);margin-top:-16px;padding-top:16px;padding-bottom:4px;display:flex;flex-direction:column;gap:12px}
.pickfoot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));z-index:2;background:var(--bg);margin-bottom:calc(-18px - env(safe-area-inset-bottom,0px));padding-top:10px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.catbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.catbar .chip{flex:none;white-space:nowrap;min-height:40px}
.cathead{margin:14px 0 2px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.entry.ex{grid-template-columns:minmax(0,1fr) auto}
.check{display:flex;align-items:flex-start;gap:12px;min-height:44px;font-weight:600;cursor:pointer}
.check input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--accent)}
.day.hasex .num::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:4px;vertical-align:middle}
.catbar[hidden]{display:none}
.icon-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.exsearch{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:8px}
.exsearch .icon-btn{width:46px;height:46px}
.pickrow.exrow{grid-template-columns:48px minmax(0,1fr) 18px;gap:12px;min-height:68px}
.exrow .ext b{display:block}
.exic{width:48px;height:48px;border-radius:12px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.exic svg,.exbig>svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.exic svg{width:28px;height:28px;stroke-width:1.8}
.exrow>svg.chev{width:18px;height:18px;fill:none;stroke:var(--ink2);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.exhero{display:flex;flex-direction:column;align-items:stretch;gap:8px}
.excat{font-size:13px;font-weight:600;color:var(--ink2)}
.exbig{width:100%;height:170px;border-radius:20px;background:var(--soft);color:var(--accent);display:grid;place-items:center}
.exbig>svg{width:96px;height:96px;stroke-width:1.4}
.icon-btn.star{border-color:transparent;background:transparent}
.icon-btn.star svg{fill:none;stroke-linejoin:round}
.icon-btn.star[aria-pressed="true"]{color:var(--accent);background:transparent}
.icon-btn.star[aria-pressed="true"] svg{fill:currentColor}
.exhero .note{text-align:left}
.exnm{margin:0;font-family:var(--display);font-size:22px;line-height:1.15;font-weight:400}
.exhero .nameinp{font-family:var(--body);font-size:18px}
.opt{font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink2)}
.ta{padding:10px 12px;min-height:84px;resize:vertical;line-height:1.4;font-family:inherit}
.exnote{font-style:italic}
.pickfoot .btn.block{width:100%}
@media (prefers-reduced-motion:reduce){.panel{animation:none}.spin{animation:none}}
</style>

</head>
<body>
<header class="top"><div class="wrap"><span class="brand">KiraKalori</span><div class="hr"><span class="sync" id="sync"><i></i><span id="syncT">Menyambung…</span></span><div class="lang" role="group" data-ta="langaria" aria-label="Bahasa / Language"><button type="button" data-act="lang" data-lang="ms" aria-pressed="true">BM</button><button type="button" data-act="lang" data-lang="en" aria-pressed="false">EN</button></div></div></div></header>
<main id="view" class="wrap"></main>

<nav class="tabs" data-ta="nav" aria-label="Menu utama"><div class="wrap">
  <button data-act="tab" data-tab="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v7a2 2 0 0 0 2 2v9M10 3v7a2 2 0 0 1-2 2M18 3c-2.2 1.2-3.5 3.8-3.5 7H18v11"/></svg><span data-t="tab_log">Log</span></button>
  <button data-act="tab" data-tab="kal"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span data-t="tab_kal">Kalendar</span></button>
  <button data-act="tab" data-tab="profil"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c.8-4 3.7-6 7.5-6s6.7 2 7.5 6"/></svg><span data-t="tab_profil">Profil</span></button>
</div></nav>

<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" data-ta="sheet_aria" aria-label="Tambah makanan"><div id="panel" class="panel"></div></div>
<div id="toast" class="toast" hidden role="status"></div>
<input type="file" id="photo" class="vh" accept="image/*">

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var pad=function(n){return String(n).padStart(2,'0');};
var keyOf=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
var fromKey=function(k){var a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
var todayKey=function(){return keyOf(new Date());};
var fmt=function(n){return Math.round(n).toLocaleString('en-US');};
var r1=function(n){return Math.round(n*10)/10;};
var newId=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);};
var kcOf=function(f){return Math.round(4*f.p+4*f.c+9*f.f);};

/* ---------- language (Bahasa Malaysia / English) ---------- */
var EB=false;try{EB=localStorage.getItem('kirakalori.eb')==='1';}catch(e){}

/* ---------- nutrition maths ---------- */
/*CALC*/
var ACT={sedentari:1.2,ringan:1.375,sederhana:1.55,aktif:1.725,sangat:1.9};
function calc(p){
  var age=+p.age,w=+p.weight,h=+p.height;
  if(!(age>=18&&age<=90&&w>=30&&w<=300&&h>=120&&h<=230))return null;
  var male=p.sex==='L';
  var bmr=10*w+6.25*h-5*age+(male?5:-161);
  var tdee=bmr*(ACT[p.activity]||1.2);
  var lose=p.goal==='turun';
  var want=lose?(p.pace==='perlahan'?275:550):0;
  var floor=male?1500:1200;
  var target=tdee-want,floored=false;
  if(target<floor){target=floor;floored=true;}
  target=Math.round(target/10)*10;
  var protein=Math.min(Math.round(w*(lose?1.6:1.2)),Math.round(target*0.30/4));
  var fat=Math.round(target*0.25/9);
  var carbs=Math.max(0,Math.round((target-protein*4-fat*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),target:target,protein:protein,fat:fat,carbs:carbs,floored:floored,floor:floor,deficit:Math.max(0,Math.round(tdee-target))};
}
/*ENDCALC*/

}

function setCloud(s){

  tx.textContent=tr(m[0]);el.className='sync '+m[1];

function queue(key,fn){var p=(writeQ[key]||Promise.resolve()).catch(function(){}).then(fn);writeQ[key]=p;return p;}
function cdoc(id){return db.collection('data/users/'+userId).doc(id);}
function clean(o){return JSON.parse(JSON.stringify(o));}
function persistDay(k){
  lsSave();
  if(!db||!userId)return Promise.resolve();
  return queue('d-'+k,function(){
    var d=state.days[k];
    if(d&&((d.entries&&d.entries.length)||(d.exercises&&d.exercises.length)||d.weight>0)){
      var o={date:k,entries:d.entries||[]};if(d.exercises&&d.exercises.length)o.exercises=d.exercises;if(d.weight>0)o.weight=d.weight;
      return cdoc('d-'+k).set(clean(o));
    }
    return cdoc('d-'+k).delete();
  }).catch(function(){setCloud('error');toast(tr('save_fail'));});
}
function persistProfile(){
  lsSave();
  if(!db||!userId||!state.profile)return Promise.resolve();
  return queue('profile',function(){return cdoc('profile').set(clean(state.profile));}).catch(function(){setCloud('error');toast(tr('save_fail'));});
}
function persistPrefs(){
  lsSave();
  if(!db||!userId)return Promise.resolve();
  return queue('prefs',function(){return cdoc('prefs').set(clean({fav:state.fav}));}).catch(function(){setCloud('error');toast(tr('save_fail'));});
}
function startCloud(){
  var timer=setTimeout(function(){if(state.cloud==='connecting')setCloud('slow');},10000);
  db.collection('data/users/'+userId).onSnapshot(function(snap){
    var cached=snap.metadata.fromCache;
    if(cached&&snap.empty)return;
    if(!cached){clearTimeout(timer);setCloud('ok');}
    if(!cached&&snap.empty&&hasLocal()){
      Object.keys(state.days).forEach(function(k){persistDay(k);});
      persistProfile();
      if(state.fav.length)persistPrefs();
      return;
    }
    var days={},profile=null,fav=null;
    snap.docs.forEach(function(d){
      var x=clean(d.data()||{}); /* snapshot data is frozen: work on a plain copy so entries can be added and removed */
      if(d.id==='profile')profile=x;
      else if(d.id==='prefs')fav=Array.isArray(x.fav)?x.fav:[];
      else if(d.id.indexOf('d-')===0)days[d.id.slice(2)]={entries:Array.isArray(x.entries)?x.entries:[],exercises:Array.isArray(x.exercises)?x.exercises:[],weight:x.weight>0?x.weight:undefined};
    });
    state.days=days;state.profile=profile;if(fav)state.fav=fav;lsSave();
    if(!state.touched)state.draft=draftFrom(profile);
    if(state.tab!=='profil'||!state.touched)render();
  },function(){clearTimeout(timer);setCloud('error');});
}

function weightChart(){

  var x=function(i){return L+(W-L-R)*(i/(pts.length-1));},y=function(w){return T+(H-T-B)*(1-(w-lo)/(hi-lo));};
  var line=pts.map(function(p,i){return x(i).toFixed(1)+','+y(p.w).toFixed(1);}).join(' ');

   '<p class="note">'+esc(tr('chart_delta',(delta>0?'+':'')+delta,since))+'</p>';

/* MET for this exercise: when a distance is given, the average speed picks the MET */
function exInfo(X){
  var a=X.i>=0?EXERCISES[X.i]:null;

  var met=a.met,sp=0,adj=false,off=false,km=num(X.km),mi=num(X.min),R=EXR[a.kind];
  if(R&&km>0&&mi>0){
    sp=km/(mi/60);
    if(sp>=R.lo&&sp<=R.hi){met=interp(R.t,sp);adj=true;}else off=true;
  }
  return {met:met,sp:sp,adj:adj,off:off};
}
function exOv(X){var v=num(X.kcal);return String(X.kcal==null?'':X.kcal).trim()!==''&&v!=null&&v>=0?v:null;}
function exEst(X){
  if(!X||X.custom)return null;
  var w=num(X.w),m=num(X.min);

  return exInfo(X).met*w*m/60;

function normItem(x){
  var n=function(v){v=Number(v);return isFinite(v)&&v>=0?Math.min(v,5000):0;};

/* ---------- photo analysis ---------- */
async function prep(file){
  var url=URL.createObjectURL(file);
  try{
    var img=await new Promise(function(res,rej){var i=new Image();i.onload=function(){res(i);};i.onerror=function(){rej(new Error('decode'));};i.src=url;});
    var iw=img.naturalWidth,ih=img.naturalHeight;
    if(!iw||!ih)throw new Error('size');
    var draw=function(max){var s=Math.min(1,max/Math.max(iw,ih));var c=document.createElement('canvas');c.width=Math.max(1,Math.round(iw*s));c.height=Math.max(1,Math.round(ih*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c;};
    var big=draw(1280);
    var blob=await new Promise(function(r){big.toBlob(r,'image/jpeg',0.85);});
    if(!blob)throw new Error('blob');
    var sq=document.createElement('canvas');sq.width=96;sq.height=96;
    var m=Math.min(iw,ih);sq.getContext('2d').drawImage(img,(iw-m)/2,(ih-m)/2,m,m,0,0,96,96);
    return {blob:blob,th:sq.toDataURL('image/jpeg',0.6),preview:draw(560).toDataURL('image/jpeg',0.7)};
  }finally{URL.revokeObjectURL(url);}
}
async function runAnalysis(){
  var my=++aid;
  S.mode='busy';S.note='';renderSheet();
  var s=await samplePromise;
  if(my!==aid)return;
  if(!s){sheetError('not_declared');return;}
  var lim=null;try{lim=await s.limits();}catch(e){}
  if(my!==aid)return;
  if(!lim||!lim.images){sheetError('images_unavailable');return;}
  ctl=new AbortController();
  try{
    var out=await s.json(buildPrompt(),{images:S.blob,signal:ctl.signal});
    if(my!==aid)return;
    ctl=null;
    var items=out&&Array.isArray(out.items)?out.items.slice(0,6).map(normItem):[];
    if(!out||out.is_food===false||!items.length){sheetError('nofood',out&&typeof out.note==='string'?out.note.slice(0,160):'');return;}
    S.items=items;S.src='foto';S.conf=CONFMAP[out.confidence]||'';
    S.note=typeof out.note==='string'?out.note.slice(0,200):'';S.meal=mealNow();S.mode='edit';renderSheet();
  }catch(e){
    if(my!==aid)return;
    ctl=null;
    if(e&&e.code==='cancelled')return;
    sheetError(e&&e.code&&ERRK[e.code]?e.code:'upstream_error');
  }
}
async function analyse(file){
  aid++;S.items=[];S.src='foto';S.preview=null;S.th=null;S.blob=null;S.note='';S.conf='';
  S.open=true;S.mode='busy';renderSheet();
  var my=aid;
  var pre;
  try{pre=await prep(file);}catch(e){if(my===aid)sheetError('image_rejected');return;}
  if(my!==aid)return;
  S.preview=pre.preview;S.th=pre.th;S.blob=pre.blob;
  runAnalysis();
}

/* ---------- actions ---------- */
function saveSheet(){
  var k=state.date;
  var day=state.days[k]||(state.days[k]={entries:[]});
  if(!day.entries)day.entries=[];
  var base=k===todayKey()?new Date():new Date(fromKey(k).getTime()+12*36e5);
  var n=0;
  S.items.forEach(function(it,i){
    var v=cur(it);
    var mp=MULTS.filter(function(m){return m[0]===it.mult;})[0];
    var e={id:newId(),t:base.toISOString(),meal:S.meal,name:(it.name||'').trim()||tr('food_default'),portion:(it.mult!==1&&mp?mp[1]+' ':'')+(it.portion||''),k:Math.round(v.k),p:r1(v.p),c:r1(v.c),f:r1(v.f),src:S.src};
    e.portion=e.portion.trim();
    if(i===0&&S.src==='foto'&&S.th)e.th=S.th;
    day.entries.push(e);n++;
  });
  var t=sheetTotals();
  persistDay(k);closeSheet();render();
  toast(tr('saved_n',n,fmt(t.k)));
}
function delEntry(id){
  var k=state.date,day=state.days[k];if(!day)return;
  var i=day.entries.findIndex(function(e){return e.id===id;});if(i<0)return;
  lastDel={k:k,e:day.entries[i],i:i};
  day.entries.splice(i,1);
  persistDay(k);render();
  toast(tr('deleted'),{id:'undo',label:tr('undo')});
}
function saveEx(){
  var X=S.ex;if(!X)return;
  var kc=exCalc();
  if(kc==null){toast(tr(X.custom?'ex_need_k':'ex_need'));return;}
  var k=state.date,day=state.days[k]||(state.days[k]={entries:[]});
  if(!day.entries)day.entries=[];
  if(!day.exercises)day.exercises=[];
  var base=k===todayKey()?new Date():new Date(fromKey(k).getTime()+12*36e5);
  var m=num(X.min),km=num(X.km),w=num(X.w),note=String(X.note||'').trim();
  var e={id:newId(),t:base.toISOString(),name:(X.name||'').trim()||tr('ex_default'),kcal:Math.round(kc)};
  if(!X.custom&&X.i>=0)e.x=EXERCISES[X.i].k;
  if(m>0)e.min=Math.round(m);
  if(km>0)e.km=Math.round(km*100)/100;
  if(note)e.note=note.slice(0,300);
  if(!X.custom&&w>=20&&w<=400){
    e.w=r1(w);
    if(exOv(X)==null)e.met=Math.round(exInfo(X).met*100)/100;
    try{localStorage.setItem('kirakalori.exw',String(r1(w)));}catch(er){}
  }
  day.exercises.push(e);
  persistDay(k);closeSheet();render();
  toast(tr('ex_saved',fmt(kc)));
}
function delEx(id){
  var k=state.date,day=state.days[k];if(!day||!day.exercises)return;
  var i=day.exercises.findIndex(function(e){return e.id===id;});if(i<0)return;
  lastDel={k:k,e:day.exercises[i],i:i,ex:true};
  day.exercises.splice(i,1);
  persistDay(k);render();
  toast(tr('ex_deleted'),{id:'undo',label:tr('undo')});
}
function undoDel(){
  if(!lastDel)return;
  var d=state.days[lastDel.k]||(state.days[lastDel.k]={entries:[]});
  var lk=lastDel.ex?'exercises':'entries';
  if(!d[lk])d[lk]=[];
  d[lk].splice(Math.min(lastDel.i,d[lk].length),0,lastDel.e);
  persistDay(lastDel.k);lastDel=null;$('#toast').hidden=true;render();
}
function shiftDay(n){var d=fromKey(state.date);d.setDate(d.getDate()+n);var k=keyOf(d);if(k>todayKey())return;state.date=k;render();window.scrollTo(0,0);}
function saveProfile(){
  var r=calc(state.draft);if(!r)return;
  var f=state.draft;
  state.profile={sex:f.sex,age:+f.age,weight:+f.weight,height:+f.height,activity:f.activity,goal:f.goal,pace:f.pace,bmr:r.bmr,tdee:r.tdee,target:{kcal:r.target,protein:r.protein,carbs:r.carbs,fat:r.fat},updated:new Date().toISOString()};
  state.touched=false;
  persistProfile();toast(tr('goal_saved',fmt(r.target)));
}
function saveWeight(){
  var v=parseFloat(String($('#wt').value).replace(',','.'));
  if(!(v>=20&&v<=400)){toast(tr('weight_bad'));return;}
  var k=todayKey(),d=state.days[k]||(state.days[k]={entries:[]});
  d.weight=r1(v);if(!d.entries)d.entries=[];
  persistDay(k);render();toast(tr('weight_saved'));
}

/* ---------- language switch ---------- */
function applyStatic(){
  document.documentElement.lang=LANG==='en'?'en':'ms';
  document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=tr(el.dataset.t);});
  document.querySelectorAll('[data-ta]').forEach(function(el){el.setAttribute('aria-label',tr(el.dataset.ta));});
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===LANG));});
  setCloud(state.cloud);
}
function setLang(v){
  if(v!=='ms'&&v!=='en')return;
  if(v!==LANG){LANG=v;try{localStorage.setItem(LSL,v);}catch(e){}}
  applyStatic();render();renderSheet();
  $('#toast').hidden=true;
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.dataset.act,ds=b.dataset;
  if(a==='tab'){state.tab=ds.tab;render();window.scrollTo(0,0);}
  else if(a==='lang')setLang(ds.lang);
  else if(a==='prev-day')shiftDay(-1);
  else if(a==='next-day')shiftDay(1);
  else if(a==='cal-prev'){var c=state.cal;c.m--;if(c.m<0){c.m=11;c.y--;}render();}
  else if(a==='cal-next'){var c2=state.cal;c2.m++;if(c2.m>11){c2.m=0;c2.y++;}render();}
  else if(a==='cal-day'){state.date=ds.date;state.tab='log';render();window.scrollTo(0,0);}
  else if(a==='add-manual'){S.items=[];S.src='manual';S.q='';S.cat='all';S.meal=mealNow();S.th=null;S.preview=null;openSheet('pick');}
  else if(a==='sheet-close')closeSheet();
  else if(a==='to-pick'){S.mode='pick';S.q='';renderSheet();}
  else if(a==='to-edit'){S.mode='edit';renderSheet();}
  else if(a==='retry')runAnalysis();
  else if(a==='cat'){
    S.cat=ds.v;
    b.parentNode.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
    $('#foodlist').innerHTML=foodListHtml();
    $('#panel').scrollTop=0;
  }
  else if(a==='pick'){var f=FOODS[+ds.i];if(f){S.items.push({name:foodName(f),portion:foodPortion(f),base:{k:kcOf(f),p:f.p,c:f.c,f:f.f},mult:1,kAuto:true});S.mode='edit';renderSheet();}}
  else if(a==='blank'){S.items.push({name:'',portion:'',base:{k:0,p:0,c:0,f:0},mult:1,kAuto:true});S.mode='edit';renderSheet();}
  else if(a==='mult'){var it=S.items[+ds.i];if(it){it.mult=+ds.m;renderSheet();}}
  else if(a==='rm-item'){S.items.splice(+ds.i,1);S.mode=S.items.length?'edit':'pick';renderSheet();}
  else if(a==='save-sheet')saveSheet();
  else if(a==='add-ex'){S.items=[];S.ex=null;S.exq='';S.exTab='all';S.exCat='all';S.exFilt=false;openSheet('expick');}
  else if(a==='ex-pick')openEx(+ds.i);
  else if(a==='ex-recent'){var rc=exRecent()[+ds.j];if(rc){if(rc.i>=0)openEx(rc.i,rc.e);else openCustomEx(rc.e);}}
  else if(a==='ex-blank')openCustomEx(null);
  else if(a==='ex-back'){S.ex=null;S.mode='expick';renderSheet();}
  else if(a==='ex-filter'){
    S.exFilt=!S.exFilt;var cb=$('#excats');if(cb)cb.hidden=!S.exFilt;
    b.setAttribute('aria-pressed',String(S.exFilt||S.exCat!=='all'));
  }
  else if(a==='ex-cat'){
    S.exCat=ds.v;
    b.parentNode.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
    var fb=$('#exfbtn');if(fb)fb.setAttribute('aria-pressed',String(S.exFilt||S.exCat!=='all'));
    $('#exlist').innerHTML=exListHtml();$('#panel').scrollTop=0;
  }
  else if(a==='ex-tab'){
    S.exTab=ds.v;
    b.parentNode.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
    $('#exlist').innerHTML=exListHtml();$('#panel').scrollTop=0;
  }
  else if(a==='ex-fav'){
    var fa=S.ex&&S.ex.i>=0?EXERCISES[S.ex.i]:null;
    if(fa){var fi=state.fav.indexOf(fa.k);if(fi<0)state.fav.push(fa.k);else state.fav.splice(fi,1);b.setAttribute('aria-pressed',String(fi<0));persistPrefs();}
  }
  else if(a==='ex-min'){
    if(S.ex){S.ex.min=ds.m;var mi=$('#exmin');if(mi)mi.value=ds.m;
      b.parentNode.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
      updateExUi();}
  }
  else if(a==='save-ex')saveEx();
  else if(a==='del-ex')delEx(ds.id);
  else if(a==='del')delEntry(ds.id);
  else if(a==='undo')undoDel();
  else if(a==='seg'){
    state.draft[ds.f]=ds.v;state.touched=true;
    b.parentNode.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});
    if(ds.f==='goal')$('#paceField').hidden=ds.v!=='turun';
    $('#result').innerHTML=resultHtml();
  }
  else if(a==='save-profile')saveProfile();
  else if(a==='save-weight')saveWeight();
});
var EXF={exmin:'min',exkm:'km',exw:'w',exkcal:'kcal',exnote:'note'};
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){S.q=t.value;$('#foodlist').innerHTML=foodListHtml();$('#panel').scrollTop=0;}
  else if(t.id==='exq'){S.exq=t.value;$('#exlist').innerHTML=exListHtml();$('#panel').scrollTop=0;}
  else if(t.id==='exname'){if(S.ex)S.ex.name=t.value;}
  else if(EXF[t.id]){
    if(S.ex)S.ex[EXF[t.id]]=t.value;
    if(t.id==='exmin')document.querySelectorAll('[data-act="ex-min"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.m===String(t.value).trim()));});
    updateExUi();
  }
  else if(t.classList.contains('nameinp')){var it=S.items[+t.dataset.i];if(it)it.name=t.value;}
  else if(t.classList.contains('numinp')){
    var i=+t.dataset.i,it2=S.items[i];if(!it2)return;
    var key=t.dataset.k,val=parseFloat(String(t.value).replace(',','.'));if(!(val>=0))val=0;
    it2.base[key]=val/(it2.mult||1);
    if(key==='k')it2.kAuto=false;
    else if(it2.kAuto!==false){
      it2.base.k=4*it2.base.p+4*it2.base.c+9*it2.base.f;
      var ki=document.querySelector('.numinp[data-i="'+i+'"][data-k="k"]');if(ki)ki.value=r1(it2.base.k*it2.mult);
    }
    $('#sheetTotal').innerHTML=totalHtml();
  }
  else if(t.id==='pf-age'||t.id==='pf-weight'||t.id==='pf-height'){
    state.draft[t.id.slice(3)]=t.value.replace(',','.');state.touched=true;$('#result').innerHTML=resultHtml();
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='mealSel')S.meal=t.value;
  else if(t.id==='eb'){EB=t.checked;try{localStorage.setItem('kirakalori.eb',EB?'1':'0');}catch(er){}}
  else if(t.id==='pf-act'){state.draft.activity=t.value;state.touched=true;$('#result').innerHTML=resultHtml();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.open)closeSheet();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('label[for="photo"]')){e.preventDefault();$('#photo').click();}
});
$('#photo').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];e.target.value='';
  if(f)analyse(f);
});

/* ---------- start ---------- */
function init(){
  lsLoad();state.draft=draftFrom(state.profile);applyStatic();render();
  var C=window.claude;
  var use=function(n){return C&&typeof C.use==='function'?Promise.resolve(C.use(n)).catch(function(){return null;}):Promise.resolve(null);};
  samplePromise=use('sample');
  if(!C){setCloud('local');return;}
  Promise.all([use('user'),use('db')]).then(async function(r){
    try{userId=r[0]?await r[0].id():null;}catch(e){userId=null;}
    db=r[1];
    if(db&&userId)startCloud();else setCloud('local');
  });
}
init();
})();
</script>
